# hparams to sweep
learning_rate: 5e-5
max_duration: 1
weight_decay: 5e-6
device_train_microbatch_size: 64
task: qnli
metric_to_monitor: MulticlassAccuracy


max_seq_len: 512
save_num_checkpoints_to_keep: 1

# Whether to run the various GLUE jobs serially or in parallel (use parallel=True to take advantage of multiple GPUs)
parallel: false

# Basic run configuration, additional details will be added to this name for each GLUE task, and each random seed
base_run_name: decoder-base-deterministic
default_seed: 19
precision: amp_bf16

# Tokenizer for dataset creation
tokenizer_name: bclavie/olmo_bert_template

# Base model config
model:
  name: flex_bert
  use_pretrained: false
  pretrained_model_name: bert-base-uncased
  tokenizer_name: ${tokenizer_name}
  pretrained_checkpoint: ${starting_cp}
  model_config:
    activation_function: gelu
    allow_embedding_resizing: true
    attention_layer: rope
    attention_probs_dropout_prob: 0.0
    attn_out_bias: false
    attn_out_dropout_prob: 0.1
    attn_qkv_bias: false
    bert_layer: prenorm
    compile_model: true
    deterministic_fa2: false
    embed_dropout_prob: 0.0
    embed_norm: true
    embedding_layer: sans_pos
    final_norm: true
    global_attn_every_n_layers: 3
    head_class_act: gelu
    head_pred_act: gelu
    hidden_act: gelu
    hidden_size: 768
    init_method: full_megatron
    intermediate_size: 1152
    local_attn_rotary_emb_base: 160000.0
    local_attn_rotary_emb_dim: null
    loss_function: fa_cross_entropy
    loss_kwargs:
      reduction: mean
    mlp_dropout_prob: 0.0
    mlp_in_bias: false
    mlp_layer: glu
    mlp_out_bias: false
    norm_kwargs:
      bias: false
      eps: 1.0e-05
    normalization: layernorm
    num_attention_heads: 12
    num_hidden_layers: 22
    padding: unpadded
    rotary_emb_base: 160000.0
    rotary_emb_dim: null
    rotary_emb_interleaved: false
    rotary_emb_scale_base: null
    skip_first_prenorm: true
    sliding_window: 128
    unpad_embeddings: true
    use_fa2: true
    vocab_size: 50368
    masked_prediction: true
    causal_mask: false
    pad_logits: false

# Saving
starting_checkpoint_load_path: ${starting_cp}
starting_cp: ./models_pythia_like/encoder_no_packing/ep0-ba599525-rank0.pt
local_pretrain_checkpoint_folder: ./bert-finetune-checkpoints-best-mnli-v2-pretrain-encoder
save_finetune_checkpoint_prefix: ./bert-finetune-checkpoints-best-mnli-v2-encoder
save_finetune_checkpoint_folder: ${save_finetune_checkpoint_prefix}/${base_run_name}

# (Optional) W&B logging
loggers:
  wandb:
    project: sweeps
    entity: mmarone-jhu

# Callbacks
callbacks:
  lr_monitor: {}
  speed_monitor: {}
  early_stopper: 
    task: ${task}
    metric_to_monitor: ${metric_to_monitor}

# Scheduler
scheduler:
  name: linear_decay_with_warmup
  t_warmup: 0.06dur
  alpha_f: 0.0

# Scheduler
optimizer:
  name: decoupled_adamw
  lr: ${learning_rate}
  betas:
  - 0.9
  - 0.98
  eps: 1.0e-06
  weight_decay: ${weight_decay}
  filter_bias_norm_wd: true
  log_grad_norm: true
  

# Task configuration
tasks:
  abc:
    seeds:
    - 42
    trainer_kwargs:
      save_num_checkpoints_to_keep: ${save_num_checkpoints_to_keep}
      max_sequence_length: ${max_seq_len}
      max_duration: ${max_duration}
      batch_size: ${device_train_microbatch_size}
      save_overwrite: true