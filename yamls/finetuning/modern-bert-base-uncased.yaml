# This YAML is built to work with the `sequence_classification.py` starter script!
#
#   Follow the instructions in that script to modify the `build_my_dataloader` function
#   and fine-tune a BERT model on your own dataset!
#
#
#   Note that some of the fields in this template haven't been filled in yet.
#   Please resolve any empty fields before launching!

# Run Name
run_name: finetune-modern-bert
default_seed: 42
parallel: false

tokenizer_name: answerdotai/modernbert-base
max_seq_len: 128

# load_path: /home/oweller2/my_scratch/retrieval_pretraining/bert24/models_pythia_like/encoder_no_packing/ep0-ba599525-rank0.pt
load_path: /home/oweller2/my_scratch/retrieval_pretraining/bert24/models_pythia_like/decoder_base_no_packing_v3/ep0-ba599525-rank0.pt
# Model
model:
  name: flex_gpt
  num_labels: 2 # <-- Make sure to update these after you modify the starter script!
  use_pretrained: true
  pretrained_model_name: bert-base-uncased
  tokenizer_name: ${tokenizer_name}
  model_config:
    vocab_size: 50368
    init_method: full_megatron
    num_hidden_layers: 22
    hidden_size: 768
    intermediate_size: 1152
    num_attention_heads: 12 # to have head size of 64
    attention_layer: rope
    attention_probs_dropout_prob: 0.0
    attn_out_bias: false
    attn_out_dropout_prob: 0.1
    attn_qkv_bias: false
    bert_layer: prenorm
    embed_dropout_prob: 0.0
    embed_norm: true
    final_norm: true
    skip_first_prenorm: true
    embedding_layer: sans_pos
    loss_function: fa_cross_entropy
    loss_kwargs:
      reduction: mean
    mlp_dropout_prob: 0.0
    mlp_in_bias: false
    mlp_layer: glu
    mlp_out_bias: false
    normalization: layernorm
    norm_kwargs:
      eps: 1e-5
      bias: false
    hidden_act: gelu
    head_pred_act: gelu
    activation_function: gelu # better safe than sorry
    padding: unpadded
    rotary_emb_dim: null
    rotary_emb_base: 10000.0
    rotary_emb_scale_base: null
    rotary_emb_interleaved: false
    allow_embedding_resizing: true
    sliding_window: 128
    global_attn_every_n_layers: 3
    unpad_embeddings: true
    compile_model: true
    # masked_prediction: true
    masked_prediction: false
    causal_mask: true

# Dataloaders (make sure to update these after you modify the starter script!)
train_loader:
  name: text
  split: train
  tokenizer_name: ${tokenizer_name}
  max_seq_len: ${max_seq_len}
  shuffle: true
  drop_last: true
  num_workers: 8

eval_loader:
  split: validation
  tokenizer_name: ${tokenizer_name}
  max_seq_len: ${max_seq_len}
  shuffle: true
  drop_last: true
  num_workers: 8

# Optimization
scheduler:
  name: linear_decay_with_warmup
  t_warmup: 0.06dur # Warmup to the full LR for 6% of the training duration
  alpha_f: 0.02 # Linearly decay to 0.02x the full LR by the end of the training duration

optimizer:
  name: decoupled_adamw
  lr: 1.0e-4
  betas:
  - 0.9
  - 0.98
  eps: 1.0e-06
  weight_decay: 1.0e-5

# Training duration and evaluation frequency
max_duration: 10ep
eval_interval: 1ep
global_train_batch_size: 64

# System
seed: 17
device_eval_microbatch_size: 16
device_train_microbatch_size: 16
precision: amp_bf16

# Logging
progress_bar: false
log_to_console: true
console_log_interval: 10ba

# Optionally log to W&B
# loggers:
#   wandb: {}

callbacks:
  speed_monitor:
    window_size: 50
  lr_monitor: {}
